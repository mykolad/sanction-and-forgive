[package]
name = "sanction-and-forgive"
version = "0.1.0"
edition = "2021"
description = "Sanction & Forgive in Rust: a port of the .NET reference (docs/conformance.md)"
license = "MIT"
publish = false

[lib]
name = "sanction_and_forgive"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
mimalloc = { version = "0.1", default-features = false }
http-body-util = "0.1"
# 0.37: a text event still holds its entity references (0.38 splits them out), as Go's and .NET's readers do.
quick-xml = { version = "0.37", features = ["encoding"] }
regex = "1"
# A fast hash for the matcher's maps (lookups only, never iterated where order matters).
rustc-hash = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "process", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep their keys in file order, as .NET's JsonElement enumerates them (the dictionaries).
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-general-category = "1"
unicode-normalization = "0.1"
# The admin sign-in's ID tokens (RS256). Version 10 needs a crypto backend chosen, or the first signature check panics
# (Dependabot's #50): rust_crypto, pure Rust like the rest of the build.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
