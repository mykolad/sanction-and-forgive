name: Build and Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The required check on master (ruleset "master: PR + checks").
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SanctionAndForgive.slnx

      - name: Build
        run: dotnet build SanctionAndForgive.slnx -c Release --no-restore

      # The build enforces most of .editorconfig, but a few style rules (an unneeded `this.`, import order) run only in
      # the IDE and in dotnet format.
      - name: Code style
        run: dotnet format style SanctionAndForgive.slnx --verify-no-changes --severity warn --no-restore

      # Every Bicep file and parameter file compiles and passes the linter. The parameter file reads the owner's
      # details from the environment (they stay out of the repository); placeholders are enough to compile it.
      - name: Bicep
        env:
          SQL_ADMIN_OBJECT_ID: 00000000-0000-0000-0000-000000000000
          SQL_ADMIN_LOGIN: ci
          IMAGE_TAG: ci
        run: |
          for file in infra/*.bicep infra/modules/*.bicep; do
            az bicep lint --file "$file"
            az bicep build --file "$file" --stdout > /dev/null
          done
          for file in infra/*.bicepparam; do
            az bicep build-params --file "$file" --stdout > /dev/null
          done

      # The smoke tests need a deployed app: the deploy workflow runs them.
      - name: Test
        run: dotnet test tests/SanctionAndForgive.Tests -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14

  # Nothing else builds the database from scratch with the real migrations on real SQL Server. Runs in parallel with
  # build-and-test; both are required on master.
  clean-database-migrations:
    name: clean-database-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway SQL Server for this job only (SQL auth: the container has no Entra ID). The password protects
    # nothing but this container, so it isn't a secret.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Throwaway-container-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Throwaway-container-2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20

    env:
      SQL_SERVER: Server=localhost,1433;User ID=sa;Password=Throwaway-container-2026!;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore and build
        run: |
          dotnet restore SanctionAndForgive.slnx
          dotnet tool restore
          dotnet build SanctionAndForgive.slnx -c Release --no-restore

      - name: No model change without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/SanctionAndForgive.Data --startup-project src/SanctionAndForgive.Api --configuration Release --no-build

      # The same bundle the deploy workflow will build.
      - name: Build the migration bundle
        run: |
          dotnet restore src/SanctionAndForgive.Api -r linux-x64
          dotnet ef migrations bundle --project src/SanctionAndForgive.Data --startup-project src/SanctionAndForgive.Api \
            --configuration Release --self-contained --target-runtime linux-x64 --output efbundle --force

      - name: Apply every migration to an empty database
        run: ./efbundle --connection "$SQL_SERVER;Database=migrations"

      # "0" rolls back to before the first migration: every Down runs. Then the whole chain again.
      - name: Roll every migration back, then apply them again
        run: |
          ./efbundle 0 --connection "$SQL_SERVER;Database=migrations"
          ./efbundle --connection "$SQL_SERVER;Database=migrations"

      # Bulk copy, application locks, the import rules and the snapshot reads need SQL Server itself (SqlServerFact tests).
      - name: Import tests on SQL Server
        env:
          SQLSERVER_TEST_CONNECTION: ${{ env.SQL_SERVER }}
        run: dotnet test tests/SanctionAndForgive.Tests -c Release --no-build --filter "FullyQualifiedName~SanctionAndForgive.Tests.Data|FullyQualifiedName~ListLoaderTests" --logger "console;verbosity=normal"
  # The conformance suite (docs/conformance.md): each implementation's image built from this commit, run as a black
  # box with a fresh database, compared with the golden files. Not a required check yet: it's the yardstick for the
  # implementations in other languages (ports/).
  conformance:
    name: conformance (${{ matrix.implementation }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - implementation: dotnet
            dockerfile: Dockerfile
            cli: '--entrypoint dotnet {image} SanctionAndForgive.Cli.dll'
          - implementation: go
            dockerfile: ports/go/Dockerfile
            cli: '--entrypoint /app/cli {image}'

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Throwaway-container-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Throwaway-container-2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Conformance suite
        shell: pwsh
        run: >-
          ./tests/conformance/run.ps1 -Build -Image 'conformance-${{ matrix.implementation }}' -Dockerfile '${{ matrix.dockerfile }}'
          -CliCommand '${{ matrix.cli }}' -SqlServer 'localhost,1433' -ContainerSqlServer 'host.docker.internal,1433'
